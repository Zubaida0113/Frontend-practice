<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>
    <h1>REGISTRATION FORM</h1>
    <form name="Myform" action="#" onsubmit="return validateForm()" onreset="resetErrors()">
        <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="Name" placeholder="Enter your full name" > <!--For and id should be same-->
            <span id="name-err" class="err-msg"></span>
        </p>
        <p>
            <label for="address">Address:</label>
            <input type="text" id="address" name="Name" name="Address" placeholder="Enter your address" />
            <span id="address-error" class="error-message"></span>
        </p>
        <p>
            <label for="email">E-mail Address:</label>
            <input type="text" id="email" name="EMail" placeholder="Enter your email" />
            <span id="email-error" class="error-message"></span>
        </p>
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="Password" placeholder="Enter your password"/>
            <span id="password-error" class="error-message"></span>
        </p>
        <p>
            <input type="submit" value="Send1" name="Submit" />
            <input type="reset" value="Reset1" name="Reset" />
        </p>
    </form>

    <script src="form.js"></script>
</body>
</html>
