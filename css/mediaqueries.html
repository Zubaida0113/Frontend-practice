<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        .container {
            height: 40vh;
            background-color: red;
        }
        @media screen and (max-width: 768px) {
            .container {
                background-color: green;
                color: darkgreen;
            }
            body{
                background-color: turquoise;
            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Natus dignissimos et id numquam rem. Dicta voluptates laudantium cumque et voluptatibus!
    </div>
</body>
</html>
