<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <title>Coming Soon</title>
  <style>
    <!---->
    body {
      background-color: #222;
      color: white;
      text-align: center; /* Center text */
      height: 100vh; /* Full viewport height */
      font-family: 'Segoe UI', sans-serif;
      padding-top: 20%; /* Center vertically */
    }
    h1 {
      font-size: 48px;
      animation: pulse 2s infinite;
    }
    p {
        font-size: 24px;
        color: #e1c20f;
        position: relative;
        overflow: hidden;
    }
    .glow-text {
        position: relative;
        display: inline-block;
        color: #e1c20f;
    }
    .glow-text::before {
        content: attr(data-text);
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent 0%, #fffbe6 50%, transparent 100%);
        background-size: 200% 100%;
        background-repeat: no-repeat;
        /* -webkit-background-clip: text; */
        -webkit-text-fill-color: transparent;
        animation: travel-glow 2s linear infinite alternate;
        pointer-events: none;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    @keyframes glow{
        0% { text-shadow: 5px 0 5px #e9bc35, 0 0 10px #e1c20f, 0 0 15px #e1c20f; }
        50% { text-shadow: 5px 0 10px #e9bc35, 0 0 20px #e1c20f, 0 0 30px #e1c20f; }
        100% { text-shadow: 5px 0 5px #e9bc35, 0 0 10px #e1c20f, 0 0 15px #e1c20f; }
    }
    @keyframes travel-glow {
        0% { background-position: 0% 0; }
        100% { background-position: 100% 0; }
    }
  </style>
</head>
<body>
  <h1>🚀 Coming Soon</h1>
  <p>
    <span class="glow-text" data-text="We're working on something awesome!">We're working on something awesome!</span>
  </p>
</body>
</html>
