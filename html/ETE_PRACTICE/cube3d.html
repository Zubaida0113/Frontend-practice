<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Rotating Cube</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f0f0;
      perspective: 1000px;
    }

    .scene {
      width: 200px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      animation: rotate 10s infinite linear;
    }

    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      opacity: 0.9;
      border: 2px solid #fff;
      font-size: 24px;
      font-weight: bold;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .front  { background: red;    transform: rotateY(  0deg) translateZ(100px); }
    .back   { background: blue;   transform: rotateY(180deg) translateZ(100px); }
    .right  { background: green;  transform: rotateY( 90deg) translateZ(100px); }
    .left   { background: orange; transform: rotateY(-90deg) translateZ(100px); }
    .top    { background: purple; transform: rotateX( 90deg) translateZ(100px); }
    .bottom { background: pink;   transform: rotateX(-90deg) translateZ(100px); }

    @keyframes rotate {
      from {
        transform: rotateX(0deg) rotateY(0deg);
      }
      to {
        transform: rotateX(360deg) rotateY(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="face front">Front</div>
    <div class="face back">Back</div>
    <div class="face right">Right</div>
    <div class="face left">Left</div>
    <div class="face top">Top</div>
    <div class="face bottom">Bottom</div>
  </div>

</body>
</html>
