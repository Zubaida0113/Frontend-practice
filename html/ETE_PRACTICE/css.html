<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            margin: 20px;
            padding: 10px;
            border: 2px solid black;
            width: 200px;
            color: blueviolet;
            background: greenyellow;
        }
.text-hover {
  font-size: 20px;
  color: black;
  transition: all 0.5s ease-in-out;
    cursor: pointer;
}

.text-hover:hover {
  color: crimson;
  font-size: 30px;
}
        .box {
            width: 100px;
            height: 100px;
            background: red;
            animation: moveRight 3s infinite alternate;
        }

        @keyframes moveRight {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(200px);
            }
        }

        .box1 {
            width: 100px;
            height: 100px;
            background: blueviolet;
            animation: moveDown 3s infinite alternate;
        }

        @keyframes moveDown {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(200px);
            }
        }

        .box3 {
            width: 100px;
            height: 100px;
            background: coral;
            animation-name: moveUp;
            animation-duration: 3s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-timing-function: ease-in-out;
        }

        @keyframes moveUp {
            from {
                transform: translateY(100px);
            }

            to {
                transform: translateY(0);
            }
        }
        .box2 {
            width: 100px;
            height: 100px;
            background: yellowgreen;
            box-shadow: 10px 10px  rgba(0, 0, 0, 0.5);
        }
        @keyframes fadeInGrow {
  from {
    opacity: 0;
    transform: scale(0.5);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

#myDiv {
  animation-name: fadeInGrow;
  animation-duration: 2s;
  animation-timing-function: ease-in-out;
  color: white;
  background-color: teal;
  padding: 20px;
  text-align: center;
  border-radius: 10px;
}
    .image-box {
  position: relative;
  width: 150px;
  height: 150px;
}

.icon {
  position: absolute;
  bottom: 5px;
  left: 5px;
  color:red ;
} 
    </style>
</head>

<body>
    <div>gone</div>
    <div id="myDiv">Hello World!</div>
    <p class="text-hover">Hover</p>
    <div class="box2"></div>
    <div class="box"></div>
    <div class="box1"></div>
    <div class="box3"></div>
    <div class="image-box">
  <img src="product.jpg" />
  <span class="icon">❤️</span>
</div>
</body>

</html>
