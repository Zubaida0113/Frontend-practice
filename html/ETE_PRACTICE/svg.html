<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Site</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #3498db; }
    canvas { border: 1px solid #000; }

    .box {
      width: 100px;
      height: 100px;
      background-color: #e74c3c;
      animation: rotateBox 3s infinite;
      margin-top: 20px;
    }

    @keyframes rotateBox {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(45deg); }
      40% { transform: rotate(0deg); }
      60% { transform: rotate(-45deg); }
      80% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>

  <h1>Interactive Static Site</h1>

  <!-- Media Elements -->
  <h2>Watch & Listen</h2>
  <video width="300" controls>
    <source src="video.mp4" type="video/mp4" />
  </video><br /><br />

  <audio controls>
    <source src="audio.mp3" type="audio/mpeg" />
  </audio>

  <!-- Form -->
  <h2>Contact Form</h2>
  <form action="/submit" method="post">
    <label for="name">Name:</label><br />
    <input type="text" id="name" name="name" required /><br /><br />

    <label for="email">Email:</label><br />
    <input type="email" id="email" name="email" required /><br /><br />

    <label for="msg">Message:</label><br />
    <textarea id="msg" name="msg" rows="4" required></textarea><br /><br />

    <button type="submit">Send</button>
  </form>

  <!-- Canvas -->
  <h2>Canvas Drawing</h2>
  <canvas id="myCanvas" width="200" height="100"></canvas>
  <script type="text/javascript">
    const canvas = document.getElementById('myCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'green';
    ctx.fillRect(10, 10, 180, 80);
  </script>

  <!-- SVG -->
  <h2>SVG Graphic</h2>
  <svg width="100" height="100">
    <circle cx="40" cy="40" r="30" stroke="blue" stroke-width="3" fill="pink" />
  </svg>

  <!-- Animated Box -->
  <h2>CSS3 Animation</h2>
  <div class="box">i am a box</div>

</body>
</html>
