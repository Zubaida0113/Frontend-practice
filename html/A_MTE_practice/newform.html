<!-- 
FOR ATTRIBUTE

The for attribute is used in <label> elements to associate the label with a specific form input.
The value of the for attribute must match the id of the input element it is associated with.
When a user clicks on the label, the associated input field is automatically focused, improving usability.

NAME ATTRIBUTE

The name attribute is used in form inputs to identify the data when the form is submitted.
It acts as the key in the key-value pair sent to the server.
Inputs with the same name are grouped together (e.g., radio buttons), and only the selected value is submitted.

How They Work Together
The for attribute improves accessibility by linking labels to inputs, 
<label for="n6-male">Male</label>
<input type="radio" name="gender" id="n6-male" value="male">

<label for="n6-female">Female</label>
<input type="radio" name="gender" id="n6-female" value="female"><br><label for="n6-male">Male</label>
<input type="radio" name="gender" id="n6-male" value="male">

<label for="n6-female">Female</label>
<input type="radio" name="gender" id="n6-female" value="female"><br>while the name attribute ensures the data is properly grouped and identified when submitted.

Example from your code:
<label for="n6-male">Gender:</label>
<input type="radio" name="gender" id="n6-male" value="male"> Male
<input type="radio" name="gender" id="n6-female" value="female"> Female

for="n6-male" links the label "Gender:" to the radio button with id="n6-male". Clicking the label will select the "Male" option.
name="gender" groups the radio buttons so only one can be selected, and the selected value (male or female) will be submitted.
