<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .well {
            background-color: #3abada;
            /* Light background for contrast */
            padding: 15px;
            /* Spacing inside each box */
            margin-bottom: 15px;
            /* Spacing below each item */
            text-align: center;
            /* Center-align text inside item */
            border: 1px solid #3015cd;
            /* Light border around the box */
        }

        .navbar-custom {
            background-color: #007bff;
            border-color: #0056b3;
        }

        .navbar-custom .navbar-brand,
        .navbar-custom .nav>li>a {
            color: white;
        }
    </style>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>
    <nav class="navbar navbar-custom navbar-fixed-bottom ">
        <div class="container-fluid">
            <div class="navbar-header">
                <a class="navbar-brand" href="#">MyBrand</a>
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#myNavbar">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
            </div>
            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="myNavbar">
                <ul class="nav navbar-nav navbar-right">
                    <li class="active"><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li class="dropdown">
                        <a class="dropdown-toggle" data-toggle="dropdown" href="#">Services
                            <span class="caret"></span>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a href="#">Web Design</a></li>
                            <li><a href="#">SEO</a></li>
                            <li class="divider"></li>
                            <li class="dropdown-header">More Services</li>
                            <li><a href="#">Marketing</a></li>
                            <li class="disabled"><a href="#">Coming
                                    Soon</a></li>
                        </ul>
                    </li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </div>
            <form class="navbar-form navbar-right">
                <input type="text" class="form-control">
            </form>
        </div>
    </nav>
    <div class="container">
        <h2>Welcome to My Website</h2>
        <p>This is a basic responsive navigation bar using Bootstrap 3.</p>
    </div>
    <div class="container">
        <h2 class="text-center">My Portfolio</h2>
        <div class="row">
            <div class="col-xs-12 col-sm-6 col-md-4">
                <div class="well">Column 1</div>
            </div>
            <div class="col-xs-12 col-sm-6 col-md-4">
                <div class="well">Column 2</div>
            </div>
            <div class="col-xs-12 col-sm-6 col-md-4">
                <div class="well">Column 3</div>
            </div>
            <div class="col-xs-12 col-sm-6 col-md-4">
                <div class="well">Column 4</div>
            </div>
            <div class="col-xs-12 col-sm-6 col-md-4">
                <div class="well">Column 5</div>
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

</body>

</html>
