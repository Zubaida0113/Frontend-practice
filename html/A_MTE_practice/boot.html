<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap 3 Grid Example</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-xs-12 col-sm-6 col-md-4 col-lg-3">
                <div class="well">Column 1</div>
            </div>
            <div class="col-xs-12 col-sm-6 col-md-4 col-lg-3">
                <div class="well">Column 2</div>
            </div>
            <div class="col-xs-12 col-sm-6 col-md-4 col-lg-3">
                <div class="well">Column 3</div>
            </div>
            <div class="col-xs-12 col-sm-6 col-md-12 col-lg-3">
                <div class="well">Column 4</div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-xs-12 col-sm-6 col-md-4">
                <div class="well">Parent Column</div>
                <div class="row">
                    <div class="col-xs-12 col-sm-6 col-md-4">
                        <div class="well">Nested Column 1</div>
                    </div>
                    <div class="col-xs-12 col-sm-6 col-md-4">
                        <div class="well">Nested Column 2</div>
                    </div>
                    <div class="col-xs-12 col-sm-6 col-md-4">
                        <div class="well">Nested Column 3</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-4 col-md-push-8">
                <div class="well">Pushed Column</div>
            </div>
            <div class="col-md-8 col-md-pull-4">
                <div class="well">Pulled Column</div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-md-4 col-md-offdet-4">
                <div class="well">Column</div>
            </div>
        </div>
    </div>
   
    <p class="hidden-xs">This text is hidden on extra-small screens.</p>
    <p class="hidden-sm">This text is hidden on small screens.</p>
    <p class="hidden-md">This text is hidden on medium screens.</p>
    <p class="hidden-lg">This text is hidden on large screens.</p>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>

</html>
