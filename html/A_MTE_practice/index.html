<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hero {
            font-size: 70px;
        }
    </style>
</head>

<body>
    <marquee behavior="scrolling" direction="right">
        <div class="hero">
            <b>Hi</b>
            <strong>Hi</strong>
            <i>Hi</i>
            <em>Hi</em>
            <mark>Hi</mark>
            <small>Hi</small>
            <del>Hi</del>
            <ins>Hi</ins>
            <sub>Hi</sub>
            <sup>Hi</sup>
        </div>
    </marquee>
    
    <H3>HTML LISTS</H3>
    <ol type="I">
        <li>Mango</li>
        <li>Orange</li>
        <li>Kiwi</li>
    </ol>
    <ul type="square">
        <li>Mango</li>
        <li>Orange</li>
        <li>Kiwi</li>
    </ul>
    <dl>
        <dt>Fruits</dt>
        <dd>Mango</dd>
        <dd>Kiwi</dd>

        <dt>Cars</dt>
        <dd>BMW</dd>
        <dd>BMW</dd>
    </dl>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Tina</td>
            <td>1</td>
            <td>22</td>
        </tr>
    </table>

    <img src="../first.jpg" alt="Field" width="500px">
    <video src=""></video>

    <iframe src="https://www.google.com" frameborder="1"></iframe>
</body>

</html>
