<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2{
            color: blue;
            background-color: rgb(97, 239, 225);
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
        }
        p{
            color: red;
            background-color: yellow;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            text-decoration: underline;
            text-transform: uppercase;
        }
        div{
            width: 500px;
            height: 400px;
            background-image: url(../first.jpg);
            
            background-size: cover;
            background-position: center;
            border-radius: 40px 90px;
            box-sizing: border-box;
            box-shadow: 20px 25px grey;
            border: 5px solid black;
            margin: 20px auto;
        }
        a{
            color: salmon;
            background: #000;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px 20px;
            box-shadow: 2px 2px 5px grey;
        }
        a:hover{
            background-color: #ea1515;
            color: white;
        }
        a:active{
            color: springgreen;
            background-color: #ea15c3;
        }
        table{
            width: 100%;
            border: #ea1515 2px solid;
            /* vertical-align: middle; */
            border-collapse: collapse;
        }
        th, td {
border: 1px solid black;
padding: 10px;
text-align: center;
 border-collapse: collapse;
}
td {
    background-color: #69f240;
}
th {
    background-color: #1febd7;
}
    </style>
</head>
<body>
    
    <h2>Rivers</h2>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Fuga, labore.</p>
    <div></div>
    <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/border-radius" target="_blank">MDN</a>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>John</td>
            <td>30</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>25</td>
            <td>Los Angeles</td>
        </tr>
    </table>
</body>
</html>
