<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Online CV Generator</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background-color: #f8f9fa;
            }
            .container {
                margin-top: 30px;
            }
            .cv {
                margin-top: 20px;
                padding: 20px;
                background: #fff;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            .cv h2 {
                text-align: center;
                color: #333;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1 class="text-center mb-4">Online CV Generator</h1>
            <form id="cvForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name:</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number:</label>
                    <input type="text" class="form-control" id="phone" placeholder="Enter your phone number" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address:</label>
                    <textarea class="form-control" id="address" placeholder="Enter your address" rows="2" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="skills" class="form-label">Skills:</label>
                    <textarea class="form-control" id="skills" placeholder="Enter your skills (comma-separated)" rows="2" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="experience" class="form-label">Experience:</label>
                    <textarea class="form-control" id="experience" placeholder="Enter your work experience" rows="3" required></textarea>
                </div>
                <button type="button" class="btn btn-primary w-100" id="generateCV">Generate CV</button>
            </form>
    
            <div class="cv mt-4" id="cv" style="display: none;">
                <h2>Curriculum Vitae</h2>
                <p><strong>Name:</strong> <span id="cvName"></span></p>
                <p><strong>Email:</strong> <span id="cvEmail"></span></p>
                <p><strong>Phone:</strong> <span id="cvPhone"></span></p>
                <p><strong>Address:</strong> <span id="cvAddress"></span></p>
                <p><strong>Skills:</strong> <span id="cvSkills"></span></p>
                <p><strong>Experience:</strong> <span id="cvExperience"></span></p>
            </div>
        </div>
    
        <!-- jQuery and Bootstrap JS -->
        <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            $(document).ready(function () {
                $('#generateCV').click(function () {
                    // Get input values
                    const name = $('#name').val();
                    const email = $('#email').val();
                    const phone = $('#phone').val();
                    const address = $('#address').val();
                    const skills = $('#skills').val();
                    const experience = $('#experience').val();
    
                    // Validate inputs
                    if (!name || !email || !phone || !address || !skills || !experience) {
                        alert("Please fill out all fields.");
                        return;
                    }
    
                    // Populate CV
                    $('#cvName').text(name);
                    $('#cvEmail').text(email);
                    $('#cvPhone').text(phone);
                    $('#cvAddress').text(address);
                    $('#cvSkills').text(skills);
                    $('#cvExperience').text(experience);
    
                    // Show CV
                    $('#cv').fadeIn();
                });
            });
        </script>
    </body>
    </html>, initial-scale=1.0">
    <title>Document</title>
</head>

</body>
</html>
